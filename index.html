
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Калькулятор стоимости заказа</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header class="site-header">
        <h1>Калькулятор стоимости заказа</h1>
        <p>Рассчитайте стоимость покупки за несколько секунд</p>
    </header>

    <main class="container">
        <section class="calculator">
            <h2>Ваш заказ</h2>

            <form id="calculator-form" novalidate>
                <div class="form-group">
                    <label for="product">Выберите товар:</label>
                    <select id="product" name="product">
                        <option value="100">Тетрадь — 100 руб.</option>
                        <option value="250">Ручка — 250 руб.</option>
                        <option value="500">Калькулятор — 500 руб.</option>
                        <option value="1200">Рюкзак — 1200 руб.</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="quantity">Количество товара:</label>
                    <input
                        type="text"
                        id="quantity"
                        name="quantity"
                        placeholder="Например, 3"
                        aria-describedby="quantity-error"
                    >
                    <p id="quantity-error" class="error" role="alert"></p>
                </div>

                <button type="submit">Рассчитать стоимость</button>
            </form>

            <div class="result-block">
                <h3>Результат</h3>
                <p id="result" aria-live="polite">
                    Стоимость заказа появится здесь.
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Калькулятор стоимости заказа · 2026</p>
    </footer>
</body>
</html>
